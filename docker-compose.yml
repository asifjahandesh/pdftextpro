services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: pdftext
      POSTGRES_PASSWORD: pdftext
      POSTGRES_DB: pdftext
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pdftext -d pdftext"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine

  backend:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://pdftext:pdftext@db:5432/pdftext}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      UPLOAD_DIR: /data/uploads
      BATCH_SIZE: ${BATCH_SIZE:-20}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-500}
    volumes:
      - uploads:/data/uploads
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: ./backend
    command: celery -A app.worker.celery worker --loglevel=info --concurrency=1
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://pdftext:pdftext@db:5432/pdftext}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      UPLOAD_DIR: /data/uploads
      BATCH_SIZE: ${BATCH_SIZE:-20}
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
